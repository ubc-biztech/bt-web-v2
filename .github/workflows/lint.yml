name: PR Rules

on:
  pull_request:

permissions: {}

jobs:
  pr-rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            if (title.length > 60) {
              core.setFailed(`PR title must be ≤60 characters (got ${title.length})`);
            }
