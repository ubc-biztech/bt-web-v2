name: PR Rules

on:
  pull_request:
    # Re-run pr-rules when the PR title is edited.
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-rules:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { title, number } = context.payload.pull_request;

            // Squash merge writes the subject as "<title> (#<number>)".
            const subject = `${title} (#${number})`;
            const maxSubjectLength = 96;
            if (subject.length > maxSubjectLength) {
              core.setFailed(`Squash commit subject "${subject}" must be ≤${maxSubjectLength} characters (got ${subject.length})`);
            }
